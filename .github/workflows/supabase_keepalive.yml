name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 6 * * *'   # 13:00 Thai time — daily ping to prevent auto-pause
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase (prevent 7-day auto-pause)
        env:
          SUPABASE_URL: https://wddepvcmfqykidgbgnut.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/cwpharma_stock_test?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase ping status: $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "206" ]; then
            echo "✅ Supabase is active"
          else
            echo "⚠️ Supabase returned $STATUS — may be paused or unreachable"
            exit 1
          fi
